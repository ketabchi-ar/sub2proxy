<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Geometric Grid Accent -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1100" y1="0" x2="1100" y2="420"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="380" x2="1200" y2="380"/>
  </g>

  <!-- Glow Orb -->
  <circle cx="210" cy="210" r="140" fill="#6366f1" opacity="0.18" filter="url(#glow)"/>

  <!-- Logo Icon Badge -->
  <g transform="translate(110, 110)">
    <rect width="200" height="200" rx="40" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="3" filter="url(#glow)"/>
    <!-- Rocket & Signal Vectors -->
    <path d="M100 45 C75 75 70 120 70 150 L100 135 L130 150 C130 120 125 75 100 45 Z" fill="url(#neonGrad)"/>
    <circle cx="100" cy="95" r="14" fill="#0f172a" stroke="#fff" stroke-width="3"/>
    <path d="M82 145 L60 160 L68 135 Z" fill="#ec4899"/>
    <path d="M118 145 L140 160 L132 135 Z" fill="#ec4899"/>
    <path d="M100 135 L93 168 L100 160 L107 168 Z" fill="#fbbf24"/>
  </g>

  <!-- Main Texts -->
  <g transform="translate(360, 140)">
    <!-- Title -->
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="url(#neonGrad)" letter-spacing="-1">sub2proxy</text>
    <text x="315" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#10b981" letter-spacing="1">v1.0 • OPEN SOURCE</text>

    <!-- Subtitle -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="22" fill="#cbd5e1">
      Smart Local Proxy &amp; Telegram Gateway (V2Ray / WireGuard to SOCKS5)
    </text>

    <!-- Persian description -->
    <text x="0" y="145" font-family="'Vazirmatn', -apple-system, sans-serif" font-weight="400" font-size="18" fill="#94a3b8">
      تبدیل هوشمند لینک‌های ساب و وایرگارد به پروکسی پایدار محلی بدون درگیر کردن اینترنت کل سیستم
    </text>

    <!-- Badges / Tags -->
    <g transform="translate(0, 185)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#312e81" stroke="#4338ca"/>
      <text x="65" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#c7d2fe" text-anchor="middle">⚡️ Anti-Hopping</text>
      <!-- Tag 2 -->
      <rect x="145" y="0" width="135" height="32" rx="16" fill="#064e3b" stroke="#047857"/>
      <text x="212" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#a7f3d0" text-anchor="middle">🛡 WireGuard Conf</text>
      <!-- Tag 3 -->
      <rect x="295" y="0" width="135" height="32" rx="16" fill="#831843" stroke="#be185d"/>
      <text x="362" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#fbcfe8" text-anchor="middle">📌 Dedicated Ports</text>
      <!-- Tag 4 -->
      <rect x="445" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#475569"/>
      <text x="510" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">🌐 Web &amp; CLI GUI</text>
    </g>
  </g>
</svg>
